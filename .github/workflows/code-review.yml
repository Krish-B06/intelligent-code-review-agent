name: Custom Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    name: Custom Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --no-ext-diff --unified=80 \
            "$BASE_SHA" "$HEAD_SHA" > review.diff

      - name: Extract PBI and requirement link
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$PR_BODY" > pr-body.txt

          PBI=$(echo "$PR_BODY" | grep -oiE 'PBI:[[:space:]]*[0-9]+' | head -1 | sed -E 's/.*:[[:space:]]*//')

          LINK=$(echo "$PR_BODY" | grep -oE 'https?://[^[:space:]>)]+' | head -1)

          echo "PBI=$PBI" >> "$GITHUB_ENV"
          echo "REQUIREMENT_LINK=$LINK" >> "$GITHUB_ENV"

          echo "PBI: ${PBI:-Not provided}"
          echo "Requirement link: ${LINK:-Not provided}"

      - name: Prepare review prompt
        run: |
          cat > review-prompt.txt <<EOF
          You are the repository's automated code review agent.

          Read and follow:

          .github/agents/code-review.agent.md
          .github/instructions/code-review.instructions.md
          .github/prompts/code-review.prompt.md

          Review ONLY the changes contained in review.diff.

          Inspect relevant repository files, requirements,
          acceptance criteria, tests, architecture documentation,
          and static-analysis results when useful.

          Pull Request description:
          --------------------------
          $(cat pr-body.txt)
          --------------------------

          PBI information:
          ${PBI:-No PBI provided}

          Requirements / acceptance-criteria link:
          ${REQUIREMENT_LINK:-No external requirements link provided}

          If a requirements or acceptance-criteria link is provided,
          use it as additional context for validating the implementation.

          If no link is provided, continue the review using the
          requirements, documentation and acceptance criteria available
          inside the repository.

          Validate the implementation against the requirements and
          acceptance criteria whenever they are available.

          Do not modify files.
          Do not create commits.
          Do not push code.
          Do not implement fixes.
          Do not rewrite developer code.

          Return the complete review in the format defined by
          the repository's code-review agent.
          EOF

      - name: Run custom review agent
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          npm install -g @github/copilot

          copilot \
            --agent=code-review \
            --prompt "$(cat review-prompt.txt)" \
            --silent \
            --no-ask-user \
            --deny-tool write \
            > review.md

          test -s review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment \
            "${{ github.event.pull_request.number }}" \
            --body-file review.md