name: Custom Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  copilot-requests: write

jobs:
  prepare-review:
    name: Prepare Code Review
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Resolve PR
      # ------------------------------------------------------------

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e

          if [ -n "$EVENT_PR_NUMBER" ]; then
            PR_NUMBER="$EVENT_PR_NUMBER"
          elif [ -n "$INPUT_PR_NUMBER" ]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
          else
            echo "Unable to determine pull request number."
            exit 1
          fi

          echo "PR number: $PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Resolve exact PR commits
      # ------------------------------------------------------------

      - name: Resolve pull request commits
        id: commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -e

          BASE_SHA=$(gh pr view "$PR_NUMBER" \
            --json baseRefOid \
            --jq '.baseRefOid')

          HEAD_SHA=$(gh pr view "$PR_NUMBER" \
            --json headRefOid \
            --jq '.headRefOid')

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "Unable to resolve PR commits."
            exit 1
          fi

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Changed files
      # ------------------------------------------------------------

      - name: Collect changed files
        env:
          BASE_SHA: ${{ steps.commits.outputs.base_sha }}
          HEAD_SHA: ${{ steps.commits.outputs.head_sha }}
        run: |
          set -e

          git diff --name-only \
            "$BASE_SHA" "$HEAD_SHA" \
            > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

      # ------------------------------------------------------------
      # Review diff
      # ------------------------------------------------------------

      - name: Generate review diff
        env:
          BASE_SHA: ${{ steps.commits.outputs.base_sha }}
          HEAD_SHA: ${{ steps.commits.outputs.head_sha }}
        run: |
          set -e

          git diff \
            --no-ext-diff \
            --unified=80 \
            "$BASE_SHA" "$HEAD_SHA" \
            > review.diff

          echo "Diff size:"
          wc -c review.diff

      # ------------------------------------------------------------
      # Repository context discovery
      # ------------------------------------------------------------

      - name: Discover review context
        run: |
          set -e

          {
            echo "=== CHANGED FILES ==="
            cat changed-files.txt

            echo
            echo "=== RELATED TEST FILES ==="

            while IFS= read -r file; do
              [ -f "$file" ] || continue

              base="${file%.*}"
              ext="${file##*.}"

              for candidate in \
                "${base}.test.${ext}" \
                "${base}.spec.${ext}" \
                "${base}_test.${ext}" \
                "${base}_spec.${ext}"; do
                [ -f "$candidate" ] && echo "$candidate"
              done
            done < changed-files.txt

            echo
            echo "=== REQUIREMENTS / ACCEPTANCE DOCUMENTS ==="

            find . \
              -type f \
              \( \
                -path './requirements/*' \
                -o -path './docs/*' \
                -o -path './specs/*' \
                -o -iname '*requirement*' \
                -o -iname '*acceptance*' \
                -o -iname '*user-story*' \
                -o -iname '*user_story*' \
              \) \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              | sort -u \
              | head -50

            echo
            echo "=== ARCHITECTURE / DESIGN DOCUMENTS ==="

            find . \
              -type f \
              \( \
                -path './architecture/*' \
                -o -path './design/*' \
                -o -iname '*architecture*' \
                -o -iname '*design*' \
                -o -iname '*hld*' \
                -o -iname '*lld*' \
              \) \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              | sort -u \
              | head -50

            echo
            echo "=== STATIC ANALYSIS FILES ==="

            find . \
              -type f \
              \( \
                -name '*.sarif' \
                -o -name '*static-analysis*' \
                -o -name '*static_analysis*' \
              \) \
              -not -path './.git/*' \
              | sort -u \
              | head -50

          } > review-manifest.txt

          cat review-manifest.txt

      # ------------------------------------------------------------
      # Validate review definitions and inputs
      # ------------------------------------------------------------

      - name: Validate review inputs
        run: |
          set -e

          test -f .github/agents/code-review.agent.md
          test -f .github/instructions/code-review.instructions.md
          test -f .github/prompts/code-review.prompt.md

          test -f changed-files.txt
          test -f review.diff
          test -f review-manifest.txt

          echo "Review definitions:"
          wc -c \
            .github/agents/code-review.agent.md \
            .github/instructions/code-review.instructions.md \
            .github/prompts/code-review.prompt.md

          echo
          echo "Review inputs:"
          wc -c \
            changed-files.txt \
            review.diff \
            review-manifest.txt

          echo
          echo "Review input validation passed."

      # ------------------------------------------------------------
      # Prepare review context
      # ------------------------------------------------------------

      - name: Collect repository review definitions
        run: |
          set -e

          mkdir -p review-context

          cp .github/agents/code-review.agent.md \
            review-context/code-review.agent.md

          cp .github/instructions/code-review.instructions.md \
            review-context/code-review.instructions.md

          cp .github/prompts/code-review.prompt.md \
            review-context/code-review.prompt.md

          cp changed-files.txt \
            review-context/changed-files.txt

          cp review.diff \
            review-context/review.diff

          cp review-manifest.txt \
            review-context/review-manifest.txt

      # ------------------------------------------------------------
      # Human-readable review metadata
      # ------------------------------------------------------------

      - name: Build review input summary
        run: |
          set -e

          {
            echo "CUSTOM CODE REVIEW INPUT"
            echo
            echo "PR: #${{ steps.pr.outputs.pr_number }}"
            echo "BASE: ${{ steps.commits.outputs.base_sha }}"
            echo "HEAD: ${{ steps.commits.outputs.head_sha }}"
            echo
            echo "Review agent:"
            echo ".github/agents/code-review.agent.md"
            echo
            echo "Instructions:"
            echo ".github/instructions/code-review.instructions.md"
            echo
            echo "Prompt:"
            echo ".github/prompts/code-review.prompt.md"
            echo
            echo "Changed files:"
            cat changed-files.txt
            echo
            echo "Review manifest:"
            cat review-manifest.txt
          } > review-context/review-input-summary.txt

      # ------------------------------------------------------------
      # Build AI execution prompt
      # ------------------------------------------------------------

      - name: Build review execution prompt
        run: |
          set -e

          cat > review-context/review-execution-prompt.txt <<'EOF'
          You are performing a repository code review.

          Use the repository custom review agent:

          .github/agents/code-review.agent.md

          Follow the repository review instructions:

          .github/instructions/code-review.instructions.md

          Follow the repository review prompt:

          .github/prompts/code-review.prompt.md

          Review ONLY the developer changes represented by:

          review.diff

          Use these supporting inputs when relevant:

          changed-files.txt
          review-manifest.txt
          review-input-summary.txt

          Review the changes for:

          - Functional correctness
          - Requirements and acceptance criteria
          - Architecture and design
          - Coding standards and maintainability
          - Security
          - Performance and scalability
          - Reliability and error handling
          - Testability and test coverage
          - Relevant static-analysis findings

          Follow the required output format defined by the custom review agent.

          Important restrictions:

          - Do NOT modify source code.
          - Do NOT create correction commits.
          - Do NOT push changes.
          - Do NOT implement recommendations.
          - Do NOT rewrite or fix developer code.
          - Return observations and recommendations only.

          Return the complete code review as text.
          EOF

          echo "Review execution prompt prepared."
          wc -c review-context/review-execution-prompt.txt

      # ------------------------------------------------------------
      # Validate prepared review context
      # ------------------------------------------------------------

      - name: Validate prepared review context
        run: |
          set -e

          test -s review-context/code-review.agent.md
          test -s review-context/code-review.instructions.md
          test -s review-context/code-review.prompt.md
          test -s review-context/changed-files.txt
          test -s review-context/review.diff
          test -s review-context/review-manifest.txt
          test -s review-context/review-input-summary.txt
          test -s review-context/review-execution-prompt.txt

          echo "Prepared review context:"
          find review-context \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Prepared review context validation passed."

      # ------------------------------------------------------------
      # Execute custom AI code review
      #
      # No --model is specified intentionally.
      # ------------------------------------------------------------

            # ------------------------------------------------------------
      # Execute repository custom review agent
      # ------------------------------------------------------------

      - name: Run custom code review agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p review-output

          npm install -g @github/copilot

          echo "Starting repository custom code review..."

          copilot \
            --agent code-review \
            --prompt "$(cat review-context/review-execution-prompt.txt)" \
            --output-format text \
            --silent \
            --deny-tool write \
            > review-output/review.md

          if [ ! -s review-output/review.md ]; then
            echo "ERROR: Copilot produced no review output."
            exit 1
          fi

          echo "Code review generated successfully."
          wc -c review-output/review.md

            # ------------------------------------------------------------
      # Validate AI review output
      # ------------------------------------------------------------

      - name: Validate AI review output
        run: |
          set -e

          test -s review-output/review.md

          echo "Review output:"
          echo "----------------------------------------"
          cat review-output/review.md
          echo "----------------------------------------"

          grep -q "Executive Summary" review-output/review.md
          grep -q "Compliance Scorecard" review-output/review.md
          grep -q "Findings" review-output/review.md
          grep -q "Recommendations" review-output/review.md
          grep -q "Overall Recommendation" review-output/review.md

          echo
          echo "Review format validation passed."

      # ------------------------------------------------------------
      # Upload prepared context + AI result
      # ------------------------------------------------------------

      - name: Upload code review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-review-result
          path: |
            review-context/
            review-output/