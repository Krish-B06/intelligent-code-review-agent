name: Custom Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    name: Custom Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR diff
        run: |
          git diff \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            --no-ext-diff --unified=80 > review.diff

      - name: Prepare review prompt
        run: |
          cat > review-prompt.txt <<'EOF'
          You are the repository's automated code review agent.

          Read and follow:
          .github/agents/code-review.agent.md
          .github/instructions/code-review.instructions.md
          .github/prompts/code-review.prompt.md

          Review ONLY the changes contained in review.diff.

          Inspect relevant repository files, requirements, tests,
          architecture documentation and static-analysis results when useful.

          Do not modify files.
          Do not create commits.
          Do not push code.
          Do not implement fixes.

          Return the complete review in the format defined by the
          repository's code-review agent.
          EOF

      - name: Run custom review agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install -g @github/copilot

          copilot \
            --agent=code-review \
            --prompt "$(cat review-prompt.txt)" \
            --silent \
            --no-ask-user \
            --deny-tool write \
            > review.md

          test -s review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment \
            "${{ github.event.pull_request.number }}" \
            --body-file review.md