name: Custom Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  code-review:
    name: Custom Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate review diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          git diff --no-ext-diff --unified=80 "$BASE_SHA" "$HEAD_SHA" > review.diff

          echo "Files being reviewed:"
          cat changed-files.txt

          echo "Diff size:"
          wc -c review.diff

      - name: Run custom code review agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm install -g @github/copilot

          copilot \
            --agent=code-review \
            --prompt "$(cat <<'PROMPT'
You are performing an automated repository code review for this Pull Request.

Use these repository files:

.github/agents/code-review.agent.md
.github/instructions/code-review.instructions.md
.github/prompts/code-review.prompt.md

Review the changes in:
review.diff

Changed files:
changed-files.txt

Inspect relevant repository files, requirements,
acceptance criteria, architecture/design documents,
tests, and static-analysis findings when available.

Review ONLY the developer changes represented by the PR diff.

Important restrictions:
- Review only.
- Do not modify source code.
- Do not create commits.
- Do not push changes.
- Do not implement fixes.
- Do not rewrite developer code.

Return the complete review using the format defined by
the repository code-review agent.
PROMPT
)" \
            --silent \
            --no-ask-user \
            --deny-tool write \
            > review.md

          test -s review.md

      - name: Post review to Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file review.md