name: Custom Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare-review:
    name: Prepare Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER="$INPUT_PR"
          fi

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number: $PR_NUMBER"
            exit 1
          fi

          BASE_SHA=$(gh pr view "$PR_NUMBER" --json baseRefOid --jq '.baseRefOid')
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          echo "PR: $PR_NUMBER"
          echo "BASE: $BASE_SHA"
          echo "HEAD: $HEAD_SHA"

      - name: Collect changed files
        env:
          BASE_SHA: ${{ steps.pr.outputs.BASE_SHA }}
          HEAD_SHA: ${{ steps.pr.outputs.HEAD_SHA }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

      - name: Generate review diff
        env:
          BASE_SHA: ${{ steps.pr.outputs.BASE_SHA }}
          HEAD_SHA: ${{ steps.pr.outputs.HEAD_SHA }}
        run: |
          git diff --no-ext-diff --unified=80 \
            "$BASE_SHA" "$HEAD_SHA" > review.diff

          echo "Diff size:"
          wc -c review.diff

      - name: Discover review context
        run: |
          {
            echo "=== CHANGED FILES ==="
            cat changed-files.txt

            echo
            echo "=== RELATED TEST FILES ==="
            while IFS= read -r file; do
              [ -f "$file" ] || continue

              base="${file%.*}"
              ext="${file##*.}"

              for candidate in \
                "${base}.test.${ext}" \
                "${base}.spec.${ext}" \
                "${base}_test.${ext}" \
                "${base}_spec.${ext}"; do
                [ -f "$candidate" ] && echo "$candidate"
              done
            done < changed-files.txt

            echo
            echo "=== REQUIREMENTS / ACCEPTANCE DOCUMENTS ==="
            find . \
              -type f \
              \( -path './requirements/*' \
                 -o -path './docs/*' \
                 -o -path './specs/*' \
                 -o -iname '*requirement*' \
                 -o -iname '*acceptance*' \
                 -o -iname '*user-story*' \
                 -o -iname '*user_story*' \) \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              | sort -u | head -50

            echo
            echo "=== ARCHITECTURE / DESIGN DOCUMENTS ==="
            find . \
              -type f \
              \( -path './architecture/*' \
                 -o -path './design/*' \
                 -o -iname '*architecture*' \
                 -o -iname '*design*' \
                 -o -iname '*hld*' \
                 -o -iname '*lld*' \) \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              | sort -u | head -50

            echo
            echo "=== STATIC ANALYSIS FILES ==="
            find . \
              -type f \
              \( -name '*.sarif' \
                 -o -name '*static-analysis*' \
                 -o -name '*static_analysis*' \) \
              -not -path './.git/*' \
              | sort -u | head -50
          } > review-manifest.txt

          cat review-manifest.txt

      - name: Collect repository review definitions
        run: |
          mkdir -p review-context

          cp .github/agents/code-review.agent.md \
            review-context/code-review.agent.md

          cp .github/instructions/code-review.instructions.md \
            review-context/code-review.instructions.md

          cp .github/prompts/code-review.prompt.md \
            review-context/code-review.prompt.md

          cp changed-files.txt review-context/changed-files.txt
          cp review.diff review-context/review.diff
          cp review-manifest.txt review-context/review-manifest.txt

      - name: Upload prepared review context
        uses: actions/upload-artifact@v4
        with:
          name: code-review-context
          path: review-context/